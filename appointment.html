<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Strategy Call - Ganeo AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=25">
    <style>
        .appointment-page {
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            height: 48px;
            position: relative;
            margin-bottom: 60px;
        }

        .progress-bar {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #9d4edd, #ff7900); /* Similar to the image gradient */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-text {
            color: #fff;
            font-family: var(--sans);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .appointment-header {
            text-align: center;
            padding: 0 20px;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .appointment-title {
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: var(--sans);
            font-size: 1.25rem;
            font-weight: 400;
            padding: 4px 12px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .appointment-subtitle {
            color: #fff;
            font-family: var(--sans);
            font-size: 2.2rem;
            font-weight: 600;
        }

        .appointment-subtitle em {
            color: #ff3366; /* Red-ish italic text like the image */
            font-style: italic;
            font-weight: 700;
        }

        .appointment-subtitle u {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .calendly-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
        }
    </style>
</head>
<body class="appointment-page">

    <div class="progress-container">
        <div class="progress-bar">
            <span class="progress-text">STEP 2/2 - Schedule Your Strategy Call</span>
        </div>
    </div>

    <div class="appointment-header">
        <div class="appointment-title">Thanks ! You're qualified for a strategy session!</div>
        <h1 class="appointment-subtitle"><em>Step 2/2</em> - Schedule Your <u>Free</u> Strategy Call</h1>
    </div>

    <div class="calendly-wrapper">
        <!-- Calendly inline widget begin -->
        <div class="calendly-inline-widget" data-url="https://calendly.com/darrshandangi/30min?hide_event_type_details=1&hide_gdpr_banner=1&background_color=111115&text_color=ffffff&primary_color=c9a84c" style="min-width:320px;height:700px;"></div>
        <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
        <!-- Calendly inline widget end -->
    </div>

</body>
</html>
