<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Strategy Call - Ganeo AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://calendly.com">
    <link rel="preconnect" href="https://assets.calendly.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=25">
    <style>
        .appointment-page {
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            height: 48px;
            position: relative;
            margin-bottom: 60px;
        }

        .progress-bar {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #9d4edd, #ff7900); /* Similar to the image gradient */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-text {
            color: #fff;
            font-family: var(--sans);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .appointment-header {
            text-align: center;
            padding: 0 20px;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .appointment-title {
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: var(--sans);
            font-size: 1.25rem;
            font-weight: 400;
            padding: 4px 12px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .appointment-subtitle {
            color: #fff;
            font-family: var(--sans);
            font-size: 2.2rem;
            font-weight: 600;
        }

        .appointment-subtitle em {
            color: #ff3366; /* Red-ish italic text like the image */
            font-style: italic;
            font-weight: 700;
        }

        .appointment-subtitle u {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .calendar-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            position: relative;
        }

        /* Instant CSS Loader for Mobile */
        .mobile-loader {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: -1; /* Sits behind the calendar, covered when it loads */
            width: 100%;
        }

        .mobile-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(201, 168, 76, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: mobile-spin 0.8s linear infinite;
        }

        @keyframes mobile-spin {
            to { transform: rotate(360deg); }
        }

        .mobile-text {
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
            animation: mobile-pulse 2s infinite ease-in-out;
        }

        @keyframes mobile-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="appointment-page">

    <div class="progress-container">
        <div class="progress-bar">
            <span class="progress-text">STEP 2/2 - Schedule Your Strategy Call</span>
        </div>
    </div>

    <div class="appointment-header">
        <div class="appointment-title">Thanks ! You're qualified for a strategy session!</div>
        <h1 class="appointment-subtitle"><em>Step 2/2</em> - Schedule Your <u>Free</u> Strategy Call</h1>
    </div>

    <div class="calendar-wrapper">
        <!-- Instant CSS Loader -->
        <div class="mobile-loader">
            <div class="mobile-spinner"></div>
            <div class="mobile-text">Checking Availability...</div>
        </div>
        
        <!-- Cal inline embed code begins -->
        <div style="width:100%;height:100%;overflow:scroll" id="my-cal-inline-30min"></div>
        <script type="text/javascript">
          (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
        Cal("init", "30min", {origin:"https://app.cal.com"});
        Cal.config = Cal.config || {};
        Cal.config.forwardQueryParams = true;

          Cal.ns["30min"]("inline", {
            elementOrSelector:"#my-cal-inline-30min",
            config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
            calLink: "darrshandangi/30min",
          });

          Cal.ns["30min"]("ui", {"hideEventTypeDetails":false,"layout":"month_view"});
          </script>
          <!-- Cal inline embed code ends -->
    </div>
</body>
</html>
